# /etc/ratelimit/ratelimit.conf – ratelimit(1) configuration
#
# The service is DISABLED by default. Add at least one rule below (or
# point the unit somewhere else), then:
#
#   systemctl enable --now ratelimit
#   systemctl reload ratelimit     # hot reload after edits (SIGHUP)
#
# See ratelimit(1) and /usr/share/doc/ratelimit/README.md for details.

[global]
verbose                = 0        # 1 = show live monitor (needs a tty; journal-friendly: keep 0)
monitor_interval       = 1        # seconds between refreshes
global_max_connections = 8192     # hard cap across all rules (TCP conns + UDP sessions)
log_level              = 2        # 0=ERR 1=WARN 2=INFO 3=DBG

# ── Example: single-port TCP rule (uncomment and adjust) ───────────
# [web]
# src_host        = 0.0.0.0
# src_port        = 8080
# dst_host        = 127.0.0.1
# dst_port        = 80
# protocol        = tcp
# rate            = 1024.00       # kB/s
# rate_unit       = kbytes        # kbytes | packets
# max_connections = 200           # per source IP
# timeout         = 60            # idle seconds before close

# ── Example: port-range rule, 8000-8009 → 9000-9009 ────────────────
# [svc]
# src_host        = 0.0.0.0
# src_port        = 8000-8009
# dst_host        = 10.0.0.1
# dst_port        = 9000-9009
# protocol        = tcp
# rate            = 512.00
# rate_unit       = kbytes
# max_connections = 100
# timeout         = 60

# ── Example: UDP DNS relay with packet-rate limit ───────────────────
# [dns-relay]
# src_host        = 0.0.0.0
# src_port        = 5300
# dst_host        = 8.8.8.8
# dst_port        = 53
# protocol        = udp
# rate            = 1000.00
# rate_unit       = packets
# max_connections = 50
# timeout         = 30
